name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commit-range checks need full history

      # The workspace includes the Tauri app, so even lint/test need the
      # WebKitGTK development libraries (verified list from v2.tauri.app).
      - name: Install Tauri 2 Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        id: rust
        with:
          toolchain: 1.100.0 # also pinned in rust-toolchain.toml
          components: rustfmt, clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Negative pattern (supported by @actions/glob): never cache
          # installers — a restored stale bundle could be reported and
          # uploaded as fresh after a failed bundle step.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/release/bundle
          key: cargo-checks-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-checks-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      - name: Rust format
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # reads packageManager: pnpm@12.21.0 from package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Typecheck the e2e suite
        run: pnpm exec tsc --noEmit -p e2e/tsconfig.json

      - name: Frontend unit tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Phase 0 guard battery (no database, 51 cases)
        run: bash testdata/phase0/guard_test.sh

      - name: ShellCheck (harness and repo scripts)
        # Warning severity: SC1091 "not following" infos on the dynamic
        # lib.sh sources are noise, not defects.
        run: shellcheck --severity=warning testdata/phase0/*.sh scripts/*.sh

      - name: Final newlines (the T011 lesson)
        run: bash scripts/check-eof.sh

      - name: Commit rules (PR range)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-commits.sh "origin/$BASE_REF..HEAD"

      - name: Protected files (answer key vs product code)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-protected.sh "origin/$BASE_REF"

      # Decision 11: patterns live only in the secret, never in public code.
      # The script fails closed when the secret is missing.
      - name: Public clean guard
        env:
          DMUX_PRIVATE_PATTERNS: ${{ secrets.PRIVATE_NAME_PATTERNS }}
        run: bash scripts/check-public-clean.sh

  build-linux:
    name: Build + smoke (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # webkit2gtk-driver ships WebKitWebDriver; xvfb gives the webview a display.
      - name: Install Tauri 2 deps, WebKitWebDriver and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        id: rust
        with:
          toolchain: 1.100.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Never cache installers (see the checks job for why).
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/release/bundle
          key: cargo-linux-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-linux-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        run: pnpm build

      - name: Build the workspace (includes the Tauri app)
        run: cargo build --workspace

      - name: Cache tauri-driver
        id: cache-tauri-driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}

      # Decision 7: the upstream tauri-driver, pinned to the Tauri 2
      # compatible release.
      - name: Install tauri-driver (pinned)
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked

      # Phase 0 done-when (PLAN.md section 11): both installers build.
      # No extra apt packages are needed for bundling: deb and rpm are
      # built by pure-Rust code in tauri-bundler (the rpm crate, no
      # rpmbuild binary), verified for CLI 2.12.4 / bundler 2.10.4.
      - name: Bundle Linux installers (deb, rpm, AppImage)
        env:
          # AppImage tooling normally needs FUSE 2, which CI runners may
          # lack. Extract-and-run avoids it; the bundler also passes
          # --appimage-extract-and-run to linuxdeploy itself (tauri#14241).
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Upload Linux installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmux-linux-installers
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      # Smoke runs AFTER bundling: `pnpm tauri build` produces the release
      # binary with the UI embedded. A plain `cargo build` binary is dev-mode
      # (loads http://localhost:5173, no embedded UI) and must not be smoked.
      # Last in the job so a smoke failure still keeps the uploaded installers.
      - name: Smoke test (WebKitGTK under Xvfb)
        timeout-minutes: 15
        env:
          DMUX_APP_BINARY: target/release/dmux-app
          # WebKitGTK's DMABUF renderer can fail on headless X servers; this
          # is the standard workaround for CI.
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: xvfb-run -a pnpm test:e2e

  build-windows:
    name: Build + smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        id: rust
        with:
          toolchain: 1.100.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Never cache installers (see the checks job for why).
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/release/bundle
          key: cargo-windows-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-windows-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        run: pnpm build

      - name: Build the workspace (includes the Tauri app)
        run: cargo build --workspace

      - name: Cache tauri-driver
        id: cache-tauri-driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-2.1.0-${{ runner.os }}

      - name: Install tauri-driver (pinned)
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked

      # Phase 0 done-when (PLAN.md section 11): the Windows installer builds.
      # NSIS is the required gate: per-user, no admin rights (installMode
      # "currentUser" in tauri.conf.json). Tauri downloads NSIS itself.
      - name: Bundle NSIS installer (per-user, required gate)
        run: pnpm tauri build --bundles nsis

      # MSI is for central IT deployment (PLAN.md section 9). WiX light.exe
      # needs the VBSCRIPT Windows feature: enabled by default, but it can
      # be disabled and is being deprecated (Tauri prerequisites, "VBSCRIPT
      # for MSI installers"; tauri-apps/tauri#13336). If the runner lacks it
      # this step fails visibly without failing the job — the NSIS installer
      # above already satisfies "the Windows installer builds". The next
      # step surfaces the outcome as a warning annotation.
      - name: Bundle MSI installer (best effort, VBSCRIPT caveat above)
        continue-on-error: true
        run: pnpm tauri build --bundles msi

      - name: Report MSI result
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue
          if ($msi) {
            Write-Host "MSI built: $($msi.Name)"
          } else {
            Write-Host "::warning::MSI bundle missing - see the previous step's log. Known cause: the VBSCRIPT Windows feature is disabled, which WiX light.exe needs (Tauri prerequisites: VBSCRIPT for MSI installers). The per-user NSIS installer built, which satisfies the Phase 0 gate."
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmux-windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Smoke runs AFTER bundling, on the release binary with the UI embedded
      # (a plain `cargo build` binary is dev-mode and must not be smoked).
      # Windows smoke is attempted: the tauri service auto-downloads a
      # matching msedgedriver for the WebView2 runtime. The required smoke
      # gate is the Linux job above; if this proves unreliable it may be
      # dropped to build-only with a documented reason. Last in the job so a
      # smoke failure still keeps the uploaded installers.
      - name: Smoke test (WebView2, auto-managed Edge driver)
        timeout-minutes: 15
        env:
          DMUX_APP_BINARY: target/release/dmux-app.exe
        shell: pwsh
        # WHY gsudo: the runner's Evergreen WebView2 Runtime (156 on the
        # 2026-11 windows-2025 image) ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
        # in ELEVATED processes from runtime 150 on — a security hardening,
        # by design, no upstream fix coming (MicrosoftEdge/WebView2Feedback#5645,
        # tauri-apps/wry#1782). msedgedriver hands the app its
        # --remote-debugging-port through exactly that variable, and the runner
        # shell is elevated (runneradmin, no split token), so the DevTools port
        # never opens: "session not created: DevToolsActivePort file doesn't
        # exist". Driver and runtime versions already match — the service reads
        # the installed runtime from the registry ("source: evergreen") — so
        # installing or updating the runtime cannot fix this. Run the suite at
        # MEDIUM integrity instead, as Tauri's own CI does (green on this same
        # image and runtime 156.0.4314.58); icacls lets the de-elevated process
        # write the workspace (the app's WebView2 user-data folder is created
        # next to the exe under target/). Environment alignment only: the smoke
        # assertions, timeout and gate are unchanged.
        run: |
          winget install gerardog.gsudo --version 2.6.1 --accept-source-agreements --accept-package-agreements
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F"
          sudo --integrity Medium pnpm test:e2e
