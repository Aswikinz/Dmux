name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    # Raised from 30m: the job now builds demo_bank, runs live-DB engine tests
    # (cargo test + llvm-cov against service containers), and the dependency and
    # secret gates below — on top of the full Tauri workspace build.
    timeout-minutes: 45
    # The comparison core's live DB tests (T019) connect to a real old/new
    # Postgres pair. Service containers stand in for the throwaway Podman mocks
    # (testdata/compose.yml): old = 9.6 LATIN1/C, new = 17 UTF-8. Credentials
    # are the public mock password (these containers are ephemeral and read
    # from, never loaded with real data). Images pinned by tag; digest pinning
    # is a Phase 1 follow-up (carry-forward from the T008 gate).
    services:
      old:
        image: postgres:9.6
        env:
          POSTGRES_USER: dmux_dev
          POSTGRES_PASSWORD: dmux_dev_only
          POSTGRES_DB: bank
          POSTGRES_INITDB_ARGS: '--encoding=LATIN1 --locale=C'
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dmux_dev -d bank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      new:
        image: postgres:17
        env:
          POSTGRES_USER: dmux_dev
          POSTGRES_PASSWORD: dmux_dev_only
          POSTGRES_DB: bank
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U dmux_dev -d bank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DMUX_TEST_OLD_URL: postgres://dmux_dev:dmux_dev_only@127.0.0.1:5433/bank
      DMUX_TEST_NEW_URL: postgres://dmux_dev:dmux_dev_only@127.0.0.1:5434/bank
      # The demo_bank fixture (built below) for engine integration tests that run
      # against real tables rather than the empty `bank` database. T021 must
      # merge after T015/T016, which add testdata/demo_bank/ to main.
      DMUX_TEST_DEMO_OLD_URL: postgres://dmux_dev:dmux_dev_only@127.0.0.1:5433/demo_bank
      DMUX_TEST_DEMO_NEW_URL: postgres://dmux_dev:dmux_dev_only@127.0.0.1:5434/demo_bank
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commit-range checks need full history

      # The workspace includes the Tauri app, so even lint/test need the
      # WebKitGTK development libraries (verified list from v2.tauri.app).
      - name: Install Tauri 2 Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        id: rust
        with:
          toolchain: 1.100.0 # also pinned in rust-toolchain.toml
          components: rustfmt, clippy, llvm-tools-preview # llvm-tools: cargo-llvm-cov

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Negative pattern (supported by @actions/glob): never cache
          # installers — a restored stale bundle could be reported and
          # uploaded as fresh after a failed bundle step.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/release/bundle
          key: cargo-checks-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-checks-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      - name: Rust format
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # demo_bank fixture: the engine's integration tests (T019 core cross-check)
      # run against real tables, not the empty `bank` database. psql 14 from the
      # runner's apt repo is protocol-v3.0 compatible with both 9.6 and 17, and
      # pg_dump/pg_restore 14 handle the 9.6 -> 17 copy (build.sh uses -Fc dump).
      - name: Install PostgreSQL client (psql, pg_dump, pg_restore)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # GHA starts service containers alongside the job and does not reliably
      # block on the health check (actions/runner#496), so wait here explicitly
      # before anything connects. The health --retries 20 above bound startup.
      - name: Wait for Postgres service containers
        run: |
          for port in 5433 5434; do
            for _ in $(seq 1 30); do
              pg_isready -h 127.0.0.1 -p "$port" -U dmux_dev -d bank && break
              sleep 2
            done
            pg_isready -h 127.0.0.1 -p "$port" -U dmux_dev -d bank
          done

      # Build the demo_bank fixture (default --plant: the answer-key build).
      # Unconditional: testdata/demo_bank/build.sh is on main (T015/T016).
      - name: Build demo_bank fixture (old -> new)
        run: bash testdata/demo_bank/build.sh 5433 5434

      - name: Rust tests
        run: cargo test --workspace

      # Coverage tooling, pinned like every other action. cargo-llvm-cov needs
      # the llvm-tools-preview component added to the toolchain above.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1

      # No --fail-under threshold yet: this is the Phase 0 skeleton. PLAN.md
      # section 9's gates (85% overall, 95% for the comparison core) arrive
      # with the real engine code and are added then, not loosened now.
      - name: Rust coverage (LCOV)
        run: cargo llvm-cov --workspace --lcov --output-path rust-lcov.info

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # reads packageManager: pnpm@12.21.0 from package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Typecheck the e2e suite
        run: pnpm exec tsc --noEmit -p e2e/tsconfig.json

      - name: Frontend unit tests (with coverage)
        # --coverage writes coverage/lcov.info (v8 provider, vite.config.ts).
        # No thresholds yet: PLAN.md section 9's 80% frontend gate arrives
        # with real UI code.
        run: pnpm test --coverage

      - name: Frontend build
        run: pnpm build

      # Fail-closed on purpose: a silent coverage-upload failure would let
      # the badge and the Codecov/SonarCloud dashboards drift from reality,
      # and coverage is a merge gate once the engine code lands (PLAN.md
      # section 9). Better a red CI than a green lie.
      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rust-lcov.info
          disable_search: true
          flags: rust
          fail_ci_if_error: true

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          flags: frontend
          fail_ci_if_error: true

      # The SonarCloud job below runs separately and needs these files.
      - name: Upload coverage reports (for SonarCloud)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            rust-lcov.info
            coverage/lcov.info
          if-no-files-found: error

      - name: Phase 0 guard battery (no database, 51 cases)
        run: bash testdata/phase0/guard_test.sh

      - name: ShellCheck (harness and repo scripts)
        # Warning severity: SC1091 "not following" infos on the dynamic
        # lib.sh sources are noise, not defects.
        run: shellcheck --severity=warning testdata/phase0/*.sh scripts/*.sh

      - name: Final newlines (the T011 lesson)
        run: bash scripts/check-eof.sh

      # Commit rules run on both PRs and pushes. On a push the range is
      # github.event.before..github.sha; when `before` is all zeros (a first
      # push of a new branch/tag) there is no `before` ancestor, so the commits
      # reachable from HEAD but not on main are checked. The identity check
      # (OWNER_EMAIL) skips merge commits inside check-commits.sh itself.
      - name: Commit rules (PR or push range)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          OWNER_EMAIL: devgru-azki@pm.me
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/$BASE_REF..HEAD"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="origin/main..HEAD"
          else
            RANGE="$BEFORE..$GITHUB_SHA"
          fi
          bash scripts/check-commits.sh "$RANGE"

      - name: Protected files (answer key vs product code)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-protected.sh "origin/$BASE_REF"

      # Decision 11: patterns live only in the secret, never in public code.
      # The script fails closed when the secret is missing.
      - name: Public clean guard
        env:
          DMUX_PRIVATE_PATTERNS: ${{ secrets.PRIVATE_NAME_PATTERNS }}
        run: bash scripts/check-public-clean.sh

      # Dependency gates (PLAN.md section 9). cargo-deny covers licences, bans,
      # sources AND advisories (same RustSec database as cargo-audit), so
      # cargo-audit is deliberately not run again — no duplication.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2

      - name: cargo-deny (licences, advisories, bans, sources)
        run: cargo deny check licenses advisories bans sources --hide-inclusion-graph

      # pnpm audit on production dependencies only, failing on high/critical.
      # pnpm is already on PATH from pnpm/action-setup above.
      - name: pnpm audit (production, high severity)
        run: pnpm audit --prod --audit-level high

      # Secret scan. The pinned binary + SHA-256 (not gitleaks-action, which
      # needs a GITLEAKS_LICENSE for some accounts). Full history is present
      # because checkout uses fetch-depth: 0.
      - name: Secret scan (Gitleaks, pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --no-banner --redact --exit-code 1 --source .

  build-linux:
    name: Build + smoke (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # webkit2gtk-driver ships WebKitWebDriver; xvfb gives the webview a display.
      - name: Install Tauri 2 deps, WebKitWebDriver and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        id: rust
        with:
          toolchain: 1.100.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Never cache installers (see the checks job for why).
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/release/bundle
          key: cargo-linux-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-linux-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        run: pnpm build

      - name: Build the workspace (includes the Tauri app)
        run: cargo build --workspace

      - name: Cache tauri-driver
        id: cache-tauri-driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}

      # Decision 7: the upstream tauri-driver, pinned to the Tauri 2
      # compatible release.
      - name: Install tauri-driver (pinned)
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked

      # Phase 0 done-when (PLAN.md section 11): both installers build.
      # No extra apt packages are needed for bundling: deb and rpm are
      # built by pure-Rust code in tauri-bundler (the rpm crate, no
      # rpmbuild binary), verified for CLI 2.12.4 / bundler 2.10.4.
      - name: Bundle Linux installers (deb, rpm, AppImage)
        env:
          # AppImage tooling normally needs FUSE 2, which CI runners may
          # lack. Extract-and-run avoids it; the bundler also passes
          # --appimage-extract-and-run to linuxdeploy itself (tauri#14241).
          APPIMAGE_EXTRACT_AND_RUN: '1'
        # linuxdeploy is downloaded from GitHub at bundle time and has flaked
        # once with an http 504. Retry up to 3 times with backoff: this is a
        # network retry, not a loosened gate — the build must still succeed.
        run: |
          set -euo pipefail
          attempt=0
          until pnpm tauri build --bundles deb,rpm,appimage; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "::error::pnpm tauri build failed $attempt times (linuxdeploy download flake)"
              exit 1
            fi
            echo "::warning::pnpm tauri build attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done

      - name: Upload Linux installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmux-linux-installers
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      # Smoke runs AFTER bundling: `pnpm tauri build` produces the release
      # binary with the UI embedded. A plain `cargo build` binary is dev-mode
      # (loads http://localhost:5173, no embedded UI) and must not be smoked.
      # Last in the job so a smoke failure still keeps the uploaded installers.
      - name: Smoke test (WebKitGTK under Xvfb)
        timeout-minutes: 15
        env:
          DMUX_APP_BINARY: target/release/dmux-app
          # WebKitGTK's DMABUF renderer can fail on headless X servers; this
          # is the standard workaround for CI.
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: xvfb-run -a pnpm test:e2e

  build-windows:
    name: Build + smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        id: rust
        with:
          toolchain: 1.100.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Never cache installers (see the checks job for why).
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/release/bundle
          key: cargo-windows-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-windows-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        run: pnpm build

      - name: Build the workspace (includes the Tauri app)
        run: cargo build --workspace

      - name: Cache tauri-driver
        id: cache-tauri-driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-2.1.0-${{ runner.os }}

      - name: Install tauri-driver (pinned)
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked

      # Phase 0 done-when (PLAN.md section 11): the Windows installer builds.
      # NSIS is the required gate: per-user, no admin rights (installMode
      # "currentUser" in tauri.conf.json). Tauri downloads NSIS itself.
      - name: Bundle NSIS installer (per-user, required gate)
        run: pnpm tauri build --bundles nsis

      # MSI is for central IT deployment (PLAN.md section 9). WiX light.exe
      # needs the VBSCRIPT Windows feature: enabled by default, but it can
      # be disabled and is being deprecated (Tauri prerequisites, "VBSCRIPT
      # for MSI installers"; tauri-apps/tauri#13336). If the runner lacks it
      # this step fails visibly without failing the job — the NSIS installer
      # above already satisfies "the Windows installer builds". The next
      # step surfaces the outcome as a warning annotation.
      - name: Bundle MSI installer (best effort, VBSCRIPT caveat above)
        continue-on-error: true
        run: pnpm tauri build --bundles msi

      - name: Report MSI result
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue
          if ($msi) {
            Write-Host "MSI built: $($msi.Name)"
          } else {
            Write-Host "::warning::MSI bundle missing - see the previous step's log. Known cause: the VBSCRIPT Windows feature is disabled, which WiX light.exe needs (Tauri prerequisites: VBSCRIPT for MSI installers). The per-user NSIS installer built, which satisfies the Phase 0 gate."
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmux-windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Smoke runs AFTER bundling, on the release binary with the UI embedded
      # (a plain `cargo build` binary is dev-mode and must not be smoked).
      # Windows smoke is attempted: the tauri service auto-downloads a
      # matching msedgedriver for the WebView2 runtime. The required smoke
      # gate is the Linux job above; if this proves unreliable it may be
      # dropped to build-only with a documented reason. Last in the job so a
      # smoke failure still keeps the uploaded installers.
      - name: Smoke test (WebView2, auto-managed Edge driver)
        timeout-minutes: 15
        env:
          DMUX_APP_BINARY: target/release/dmux-app.exe
        shell: pwsh
        # WHY gsudo: the runner's Evergreen WebView2 Runtime (156 on the
        # 2026-11 windows-2025 image) ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
        # in ELEVATED processes from runtime 150 on — a security hardening,
        # by design, no upstream fix coming (MicrosoftEdge/WebView2Feedback#5645,
        # tauri-apps/wry#1782). msedgedriver hands the app its
        # --remote-debugging-port through exactly that variable, and the runner
        # shell is elevated (runneradmin, no split token), so the DevTools port
        # never opens: "session not created: DevToolsActivePort file doesn't
        # exist". Driver and runtime versions already match — the service reads
        # the installed runtime from the registry ("source: evergreen") — so
        # installing or updating the runtime cannot fix this. Run the suite at
        # MEDIUM integrity instead, as Tauri's own CI does (green on this same
        # image and runtime 156.0.4314.58); icacls lets the de-elevated process
        # write the workspace (the app's WebView2 user-data folder is created
        # next to the exe under target/). Environment alignment only: the smoke
        # assertions, timeout and gate are unchanged.
        run: |
          winget install gerardog.gsudo --version 2.6.1 --accept-source-agreements --accept-package-agreements
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F"
          sudo --integrity Medium pnpm test:e2e

  # SonarCloud scan (project Aswikinz_Dmux, organization "aswikinz" — verified
  # via https://sonarcloud.io/api/organizations/search?organizations=aswikinz).
  # A dedicated job, after checks: the scanner needs the coverage reports but
  # not the build toolchains, and keeping it out of checks keeps the gate job
  # fast. Both jobs run on ubuntu-22.04 with the same workspace path, so the
  # absolute SF: paths in rust-lcov.info resolve against this checkout too.
  #
  # Coverage properties (SonarCloud docs, "Rust" and "JavaScript/TypeScript
  # test coverage"): Rust LCOV goes through sonar.rust.lcov.reportPaths, JS/TS
  # LCOV through sonar.javascript.lcov.reportPaths (the old
  # sonar.typescript.lcov.reportPaths is deprecated). The generic
  # sonar.coverageReportPaths is only for Sonar's generic coverage format.
  # NOTE: coverage import requires CI-based analysis — automatic analysis must
  # be OFF in the project's Administration > Analysis Method (Maya confirms).
  #
  # Scope (SonarCloud "new analysis scope UX", setting-analysis-scope docs):
  # sonar.sources / sonar.tests / sonar.test.inclusions have no effect there —
  # the whole project is analysed by default — so they are omitted. Scope is
  # narrowed only via exclusions: sonar.exclusions (generated/build/lock files,
  # the huge RESULTS.md, icons), sonar.coverage.exclusions (test code), and
  # sonar.cpd.exclusions (testdata, which is deliberately repetitive fixtures).
  sonar:
    name: SonarCloud scan
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SCM blame and new-code detection need full history

      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports

      # Fail closed: without the token the scan cannot run, and a skipped
      # scan would silently stop reporting issues. Maya confirms the secret
      # exists before this merges (owner is adding SONAR_TOKEN).
      - name: Require SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN secret is missing. Add it in the repo settings (SonarCloud project Aswikinz_Dmux, organization aswikinz) before merging."
            exit 1
          fi

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
