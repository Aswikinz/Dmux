name: CodeQL

# Code scanning for Rust and JavaScript/TypeScript. Rust is only supported with
# build-mode "none" (CodeQL analyzes the source directly; it does not support
# autobuild/manual for Rust — github/community discussion #161754, and the
# 2025-10-14 changelog "CodeQL scanning Rust and C/C++ without builds is GA").
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1' # weekly, Monday 04:00 UTC

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ['rust', 'javascript-typescript']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: ${{ matrix.language }}
