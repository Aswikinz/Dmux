name: Release

# Decision 14: pushing a v* tag creates a PUBLISHED release (not a draft)
# with both-platform installers, CLI binaries, SHA-256 checksums and an SBOM.
# Unsigned until code-signing approval; the release body carries the SmartScreen
# note. Decision 20: every pre-1.0 tag (v0.*), and any tag with a
# pre-release suffix (v1.0.0-rc.1), is published as a PRE-RELEASE.
on:
  push:
    tags: ['v*']
  # Dry run: builds and packages everything, uploads the result as one workflow
  # artifact, and publishes nothing (no release, no attestation, no signature).
  # Run it from any branch to test the packaging. Publishing needs a v* tag push.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package everything but do not publish a release'
        type: boolean
        default: true

# Least privilege: read-only by default for the whole workflow. The build jobs
# run pnpm install and tauri build, which execute third-party install scripts,
# so a repo-write token must never be available to them. Only the `release` job
# below is granted contents: write, because gh release create writes the release.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail loudly BEFORE any build if the tag and the manifest versions drift.
  version-guard:
    name: Version guard
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match tauri.conf.json and package.json
        env:
          REF_TYPE: ${{ github.ref_type }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          # A manual run from a branch has no tag to compare. It may only be a
          # dry run; publishing a release always needs a v* tag push.
          if [ "$REF_TYPE" != "tag" ]; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::publishing a release needs a v* tag; run from a branch only as a dry run"
              exit 1
            fi
            conf=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
            pkg=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
            if [ "$conf" != "$pkg" ]; then
              echo "::error::tauri.conf.json version $conf does not match package.json version $pkg"
              exit 1
            fi
            echo "Dry run on $GITHUB_REF_NAME: manifests agree on $conf (no tag to compare)"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          conf=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          pkg=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          fail=0
          if [ "$TAG" != "$conf" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src-tauri/tauri.conf.json version $conf"
            fail=1
          fi
          if [ "$TAG" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            echo "Version guard OK: $GITHUB_REF_NAME == $conf == $pkg"
          fi
          exit "$fail"

  build-linux:
    name: Build release (Ubuntu 22.04)
    needs: version-guard
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same dependency list as ci.yml's checks job (verified for Tauri 2),
      # plus musl-tools: the static CLI below compiles C (rustls/ring).
      - name: Install Tauri 2 Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev musl-tools

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        id: rust
        with:
          toolchain: 1.100.0
          targets: x86_64-unknown-linux-musl

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Never cache installers (see ci.yml's checks job for why).
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/release/bundle
          key: cargo-release-linux-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-linux-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri build runs beforeBuildCommand (pnpm build) itself. deb and rpm
      # are pure-Rust bundling; AppImage needs extract-and-run (no FUSE 2 on
      # runners) exactly as in ci.yml.
      - name: Bundle Linux installers (deb, rpm, AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        # linuxdeploy is downloaded from GitHub at bundle time and has flaked
        # once with an http 504. Retry up to 3 times with backoff: this is a
        # network retry, not a loosened gate — the build must still succeed.
        run: |
          set -euo pipefail
          attempt=0
          until pnpm tauri build --bundles deb,rpm,appimage; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "::error::pnpm tauri build failed $attempt times (linuxdeploy download flake)"
              exit 1
            fi
            echo "::warning::pnpm tauri build attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done

      # Static CLI for jump servers (PLAN.md section 9), statically linked
      # against musl by the rustup target's self-contained libc.
      # The CLI's own code is plain std, but it links dmux-engine, which brings
      # in rustls/ring — and ring compiles C, so the musl target now needs a C
      # toolchain. ubuntu-22.04's musl-tools ships musl-gcc but NOT the
      # triple-prefixed x86_64-linux-musl-gcc name cc-rs probes for first
      # (checked against the jammy package file list), so CC_<target> names
      # musl-gcc explicitly; cc-rs uses CC_<target> verbatim. T013 predicted
      # this dependency; omitting it is what failed the v0.1.0 build (T037).
      - name: Build static CLI (musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release -p dmux-cli --target x86_64-unknown-linux-musl --locked

      - name: Stage and verify the static CLI
        run: |
          # Flat staging dir: upload-artifact keeps directory structure, and
          # the release job checksums a flat artifacts/ directory. cp fails
          # if any bundle type is missing (fail closed).
          # Named release-out, NOT dist: dist/ is where Vite writes the frontend
          # build (tauri.conf.json frontendDist), so v0.0.1 leaked index.html +
          # assets/ into the release by staging the installers there.
          mkdir -p release-out
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage release-out/
          cp target/x86_64-unknown-linux-musl/release/dmux release-out/dmux-x86_64-unknown-linux-musl
          if ! file release-out/dmux-x86_64-unknown-linux-musl | grep -q 'static'; then
            echo "::error::CLI binary is not statically linked"
            exit 1
          fi

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmux-release-linux
          path: release-out/*
          if-no-files-found: error

  # Flatpak bundle (PLAN.md section 9), built from the release .deb so it is the
  # same binary as the other Linux installers. Ubuntu 24.04 for a current
  # flatpak and flatpak-builder; the runtime comes from Flathub.
  build-flatpak:
    name: Build Flatpak bundle
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Linux build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmux-release-linux
          path: linux-artifacts

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Validate the desktop file and metainfo
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          sed -i "s/@VERSION@/$VERSION/; s/@DATE@/$(date -u +%F)/" packaging/flatpak/verify.dmux.desktop.metainfo.xml
          desktop-file-validate packaging/flatpak/verify.dmux.desktop.desktop
          appstreamcli validate --no-net packaging/flatpak/verify.dmux.desktop.metainfo.xml

      - name: Build the Flatpak bundle
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          # Exactly one .deb is expected; cp fails closed on none or several.
          cp linux-artifacts/*.deb packaging/flatpak/dmux.deb
          flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build \
            packaging/flatpak/verify.dmux.desktop.yml
          mkdir -p release-out
          flatpak build-bundle flatpak-repo "release-out/Dmux_${VERSION}_x86_64.flatpak" \
            verify.dmux.desktop --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          test -s "release-out/Dmux_${VERSION}_x86_64.flatpak"

      - name: Upload Flatpak release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmux-release-flatpak
          path: release-out/*
          if-no-files-found: error

  build-windows:
    name: Build release (Windows)
    needs: version-guard
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        id: rust
        with:
          toolchain: 1.100.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Never cache installers (see ci.yml's checks job for why).
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/release/bundle
          key: cargo-release-windows-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-windows-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # PLAN.md 4.9: the Windows build ships its own Python for custom checks.
      # The official CPython "embeddable package" is downloaded here (never
      # committed) at a pinned version, and the file must match the pinned
      # SHA-256 or the build fails. To upgrade: change the version, download the
      # file from python.org yourself, and record its SHA-256 below.
      # python.org also publishes an SPDX SBOM for the package; it is pinned the
      # same way and attached to the release.
      - name: Download and verify the embedded Python (CPython)
        shell: pwsh
        env:
          PY_VERSION: '3.12.10'
          PY_ZIP_SHA256: '4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3'
          PY_SPDX_SHA256: 'efa53ba4f26e8a06410677ec6d010e97133a7a1ab38e0485f6936da2911879fa'
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://www.python.org/ftp/python/$env:PY_VERSION"
          $zipName = "python-$env:PY_VERSION-embed-amd64.zip"
          $dl = 'packaging/windows/downloads'
          New-Item -ItemType Directory -Force $dl | Out-Null
          foreach ($pair in @(@($zipName, $env:PY_ZIP_SHA256), @("$zipName.spdx.json", $env:PY_SPDX_SHA256))) {
            $file = Join-Path $dl $pair[0]
            Invoke-WebRequest -Uri "$base/$($pair[0])" -OutFile $file
            $got = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($got -ne $pair[1]) {
              throw "SHA-256 mismatch for $($pair[0]): expected $($pair[1]), got $got"
            }
            Write-Host "Verified $($pair[0]) ($got)"
          }
          Expand-Archive -Path (Join-Path $dl $zipName) -DestinationPath packaging/windows/python
          if (-not (Test-Path packaging/windows/python/python.exe)) { throw 'python.exe missing after extraction' }
          if (-not (Test-Path packaging/windows/python/LICENSE.txt)) { throw 'CPython LICENSE.txt missing after extraction' }

      # NSIS is the required gate: per-user, no admin rights (installMode
      # "currentUser" in tauri.conf.json). Tauri downloads NSIS itself.
      # Every Windows package gets the python/ resource folder through the
      # extra config file (it exists only in this job, so Linux builds and
      # local builds are unaffected).
      - name: Bundle NSIS installer (per-user, required gate)
        run: pnpm tauri build --bundles nsis --config packaging/windows/tauri.python.conf.json

      # Stage the normal setup now: the offline build below overwrites the same
      # file name in target/release/bundle/nsis.
      - name: Stage the normal setup installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-out | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe
          if ($setup.Count -ne 1) { throw "expected exactly one NSIS setup, found $($setup.Count)" }
          Copy-Item $setup.FullName release-out/

      # Offline setup (PLAN.md section 9): the same installer with the WebView2
      # offline installer embedded (about 127 MB larger), for PCs with no
      # internet. It is a SEPARATE file so the normal installer stays small and
      # keeps the downloader, which is the right default for PCs with internet.
      - name: Bundle the offline-WebView2 NSIS installer
        run: pnpm tauri build --bundles nsis --config packaging/windows/tauri.python.conf.json --config packaging/windows/tauri.offline.conf.json

      - name: Stage the offline setup installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe
          if ($setup.Count -ne 1) { throw "expected exactly one NSIS setup, found $($setup.Count)" }
          $name = $setup.Name -replace '-setup\.exe$', '-offline-setup.exe'
          if ($name -eq $setup.Name) { throw "unexpected setup file name $($setup.Name)" }
          Copy-Item $setup.FullName (Join-Path release-out $name)
          # The offline installer carries the WebView2 offline installer, so it
          # must be much larger than the normal one.
          $normal = Get-ChildItem release-out/*-setup.exe | Where-Object { $_.Name -notlike '*-offline-setup.exe' }
          $off = Get-Item (Join-Path release-out $name)
          if ($off.Length -le ($normal.Length + 50MB)) { throw "offline setup ($($off.Length) bytes) is not clearly larger than the normal setup ($($normal.Length) bytes)" }

      # MSI is best effort with the same VBSCRIPT caveat as ci.yml: WiX
      # light.exe needs the VBSCRIPT Windows feature, which can be disabled
      # on the runner. A missing MSI warns but does not fail the release;
      # the NSIS installer satisfies the Windows gate.
      - name: Bundle MSI installer (best effort, VBSCRIPT caveat above)
        continue-on-error: true
        run: pnpm tauri build --bundles msi --config packaging/windows/tauri.python.conf.json

      - name: Report MSI result
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue
          if ($msi) {
            Write-Host "MSI built: $($msi.Name)"
          } else {
            Write-Host "::warning::MSI bundle missing - see the previous step's log. Known cause: the VBSCRIPT Windows feature is disabled, which WiX light.exe needs (Tauri prerequisites: VBSCRIPT for MSI installers). The per-user NSIS installer built, which satisfies the Windows gate."
          }

      - name: Build CLI (Windows)
        run: cargo build --release -p dmux-cli --locked

      - name: Stage the MSI, CLI, portable zip and Python SBOM
        shell: pwsh
        env:
          PY_VERSION: '3.12.10'
        run: |
          $ErrorActionPreference = 'Stop'
          # Flat staging dir (see the Linux job). The setup installers were
          # staged above; the CLI and portable zip are required (Copy-Item and
          # Compress-Archive fail without them). MSI is best effort.
          New-Item -ItemType Directory -Force release-out | Out-Null
          $msi = Get-ChildItem target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue
          if ($msi) { Copy-Item $msi.FullName release-out/ }
          Copy-Item target/release/dmux.exe release-out/dmux-x86_64-pc-windows-msvc.exe

          # Portable .zip: runs with no install. WebView2 must already be on the
          # PC (said in README.txt). Same app exe the installers carry, plus the
          # private Python folder the app looks for next to itself.
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $stage = "portable-stage/Dmux_${version}_x64-portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/dmux-app.exe $stage/
          Copy-Item -Recurse packaging/windows/python $stage/python
          Copy-Item packaging/windows/PORTABLE-README.txt $stage/README.txt
          Copy-Item THIRD_PARTY_NOTICES.md $stage/
          Copy-Item crates/dmux-report/fonts/OFL-1.1.txt $stage/
          Copy-Item LICENSE $stage/LICENSE.txt
          Compress-Archive -Path $stage -DestinationPath "release-out/Dmux_${version}_x64-portable.zip"

          # SPDX SBOM of the embedded CPython, as published by python.org
          # (already SHA-256 verified above).
          Copy-Item "packaging/windows/downloads/python-$env:PY_VERSION-embed-amd64.zip.spdx.json" release-out/sbom-cpython-windows-embed.spdx.json

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmux-release-windows
          path: release-out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version-guard, build-linux, build-flatpak, build-windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # The only job that may write to the repository: gh release create below
    # publishes the release, the attestation step persists build provenance, and
    # cosign signs SHA256SUMS with the workflow's GitHub OIDC identity. Everything
    # before this job stays read-only (the top-level permissions block).
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # 'true' only for a real v* tag push (or a tag run with dry_run off). A
      # dry run does every build and packaging step but skips attestation,
      # signing and the release itself.
      PUBLISH: ${{ github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      # gh authenticates with the GH_TOKEN env below, and nothing here pushes
      # through git, so the checkout token is not needed in .git/config either.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dmux-release-*
          merge-multiple: true
          path: artifacts

      - name: Check artifacts are present
        run: |
          ls -l artifacts
          # Fail closed: never publish a release missing a platform's files.
          # (-setup.exe appears twice: the normal setup and *-offline-setup.exe.)
          for pat in '*.deb' '*.rpm' '*.AppImage' '*.flatpak' '*_x64-setup.exe' '*_x64-offline-setup.exe' '*_x64-portable.zip' 'sbom-cpython-windows-embed.spdx.json' 'dmux-x86_64-unknown-linux-musl' 'dmux-x86_64-pc-windows-msvc.exe'; do
            if ! compgen -G "artifacts/$pat" > /dev/null; then
              echo "::error::release artifact missing: $pat"
              exit 1
            fi
          done

      # SBOM 1/2: CycloneDX for the Rust workspace. cargo-cyclonedx emits one
      # BOM per workspace member (virtual root has none); collect them all.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-cyclonedx@0.5.10

      - name: Generate Rust SBOMs (CycloneDX)
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --override-filename sbom-rust
          for f in crates/*/sbom-rust.json src-tauri/sbom-rust.json; do
            if [ ! -f "$f" ]; then
              echo "::error::missing Rust SBOM: $f"
              exit 1
            fi
            cp "$f" "artifacts/sbom-rust-$(basename "$(dirname "$f")").json"
          done

      # SBOM 2/2: CycloneDX for the npm PRODUCTION dependencies, from the
      # committed pnpm-lock.yaml. cdxgen (the CycloneDX generator with pnpm
      # lockfile support) is used instead of @cyclonedx/cyclonedx-npm, which
      # only reads npm lockfiles — generating one here would re-resolve
      # transitive versions against the registry and could drift from the
      # pinned pnpm lock. Staging ONLY package.json + pnpm-lock.yaml keeps
      # the parse lockfile-based and dev-free even if node_modules exists.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Generate npm production SBOM (CycloneDX)
        env:
          # T030 (githubactions:S6505): npx installs cdxgen into its cache before
          # running it, so suppress dependency lifecycle scripts — a transitive
          # dependency's install hook must never run on the release runner.
          # cdxgen's pnpm-lock parsing is pure JS and needs no install scripts.
          npm_config_ignore_scripts: 'true'
        run: |
          # cdxgen writes supporting output BESIDE its -o path, and v0.0.1 left
          # a subdirectory in artifacts/ that way. Generate into scratch space
          # and copy ONLY the BOM into artifacts/, so artifacts/ stays flat.
          mkdir -p sbom-npm-work sbom-npm-out
          cp package.json pnpm-lock.yaml sbom-npm-work/
          npx --yes @cdxgen/cdxgen@13.8.0 -t pnpm --required-only --fail-on-error \
            --spec-version 1.6 -o sbom-npm-out/sbom-npm.json sbom-npm-work
          if [ ! -f sbom-npm-out/sbom-npm.json ]; then
            echo "::error::cdxgen did not write sbom-npm-out/sbom-npm.json"
            exit 1
          fi
          cp sbom-npm-out/sbom-npm.json artifacts/sbom-npm.json
          # Fail closed if the BOM is not parseable JSON.
          python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' artifacts/sbom-npm.json

      - name: Write and verify SHA-256 checksums
        run: |
          # Diagnostics first: files only may ever be checked here, so any
          # subdirectory (v0.0.1 hit "assets: Is a directory") is reported.
          echo "Subdirectories under artifacts/ (diagnostic; none expected):"
          find artifacts -mindepth 1 -maxdepth 1 -type d -print
          # Top-level REGULAR files only, excluding SHA256SUMS itself and the
          # cosign bundle (the bundle is written AFTER this step, but exclude it
          # here too so no reordering can ever list a signature over the sums
          # inside the sums). -print0 / sort -z / xargs -0 keep odd filenames
          # (spaces, leading dashes) intact; LC_ALL=C makes the ordering stable
          # across runners.
          mapfile -d '' files < <(find artifacts -mindepth 1 -maxdepth 1 -type f \
            ! -name SHA256SUMS ! -name SHA256SUMS.cosign.bundle -printf '%P\0' | LC_ALL=C sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no files to checksum in artifacts/"
            exit 1
          fi
          (
            cd artifacts
            printf '%s\0' "${files[@]}" | xargs -0 sha256sum -- > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      # Provenance (M8): attest every published artifact in one SLSA build
      # provenance attestation. Runs AFTER SHA256SUMS is written, so the sums
      # file is covered, and BEFORE the cosign bundle below exists, so the
      # bundle (signature metadata, not a build output) is not double-counted.
      # subject-path globs artifacts/ and the action attests each regular file.
      - name: Attest build provenance (SLSA)
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

      # Keyless signature over SHA256SUMS (M8): closes the "anyone who can edit
      # the release can edit the sums" gap. cosign signs with the workflow's
      # GitHub OIDC identity (id-token: write above), so the signature binds to
      # this workflow on a v* tag, not to a long-lived key. The bundle is
      # written AFTER SHA256SUMS and is not itself listed inside it.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3 (installs cosign v3.1.4)
        if: env.PUBLISH == 'true'

      - name: Sign SHA256SUMS keylessly (Sigstore)
        if: env.PUBLISH == 'true'
        run: |
          cosign sign-blob --yes --bundle artifacts/SHA256SUMS.cosign.bundle artifacts/SHA256SUMS
          # Fail closed: a zero-byte or missing bundle means signing did not run.
          test -s artifacts/SHA256SUMS.cosign.bundle

      # Decision 14: PUBLISHED, not draft (no --draft). Decision 20: any v0.*
      # tag is a pre-release, so the flag is computed from the tag itself and
      # cannot drift from the version the guard just checked. The header states
      # pre-release or stable status and the unsigned-installer SmartScreen note; GitHub's
      # generated notes follow it.
      # Dry run: keep everything that would have been published, so the
      # packaging can be inspected without making a release.
      - name: Upload dry-run artifacts (nothing is published)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmux-dry-run-release
          path: artifacts/*
          if-no-files-found: error

      - name: Create the published release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          extra=()
          : > header.md
          # A v0.* tag, or any tag with a pre-release suffix such as
          # v1.0.0-rc.1, is a GitHub pre-release.
          if [[ "$TAG" == v0.* || "$TAG" == *-* ]]; then
            extra=(--prerelease)
            echo "Pre-release tag: publishing as a pre-release"
            cat >> header.md <<'EOF'
          **Pre-release.** The UI, report formats and comparison details can
          still change before the next stable version. Pre-releases are
          published as GitHub pre-releases.

          EOF
          else
            echo "Tag $TAG is a stable release: publishing as a normal release"
            cat >> header.md <<'EOF'
          **Stable release.** Saved fingerprint files record the normalisation
          rules they were captured with; a capture made under other rules, or
          by a version that did not record them, is refused and must be
          captured again with this version.

          EOF
          fi
          cat >> header.md <<'EOF'
          **Unsigned installers.** Windows SmartScreen will warn until
          code-signing approval lands (PLAN.md section 9). Verify every download
          before running it: check the signature on `SHA256SUMS`, check the
          file's checksum against it, then install — see `SECURITY.md`.

          Attached: Linux deb/rpm/AppImage installers and a Flatpak bundle,
          Windows setup installers (normal, and an offline one that carries
          WebView2 for PCs with no internet), an MSI (when the build runner
          allows) and a portable zip, static Linux and Windows CLI binaries,
          SHA-256 checksums plus their Sigstore signature, and SBOMs for the
          Rust workspace, the npm production dependencies and the Python that
          the Windows builds carry. Every attached file carries a
          build-provenance attestation.
          EOF
          # The heredoc sits inside this indented run block, so strip that
          # indentation: Markdown would otherwise render the header as code.
          sed -i 's/^ *//' header.md
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > generated.md
          cat header.md generated.md > notes.md
          # Attach top-level REGULAR files only (installers, CLI binaries,
          # SBOMs, SHA256SUMS and its Sigstore bundle). A bare artifacts/* glob
          # would hand directories to gh, which cannot upload them.
          mapfile -d '' assets < <(find artifacts -mindepth 1 -maxdepth 1 -type f -print0 \
            | LC_ALL=C sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no release assets found in artifacts/"
            exit 1
          fi
          printf 'Attaching %d files:\n' "${#assets[@]}"
          printf '  %s\n' "${assets[@]}"
          gh release create "$TAG" --verify-tag "${extra[@]}" \
            --title "Dmux $TAG" --notes-file notes.md "${assets[@]}"
