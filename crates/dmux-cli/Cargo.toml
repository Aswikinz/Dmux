[package]
name = "dmux-cli"
description = "Dmux command-line runner: capture, compare, run (Phase 0 skeleton)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dmux"
path = "src/main.rs"

[dependencies]
dmux-engine = { path = "../dmux-engine" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0.154"
