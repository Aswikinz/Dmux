[package]
name = "dmux-engine"
description = "Dmux comparison engine, shared by the desktop app and the CLI (Phase 0 skeleton)"
version.workspace = true
edition.workspace = true
license.workspace = true
# Never published: this is the app's engine. Keeps the unversioned workspace
# path dependency out of cargo-deny's wildcard check (see deny.toml [bans]).
publish = false

[dependencies]
async-trait = "0.1.92"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
# tokio-postgres-rustls 0.14.0 depends on rustls 0.23.x. We pin the exact stable
# patch Cargo resolves so CI stays reproducible and we never pull a -dev release.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# webpki-roots gives a fixed, auditable public-CA bundle that works on locked-down
# machines without relying on the operating-system certificate store.
webpki-roots = "0.26"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
hex = "0.4.3"
# App-side hashing when a server cannot run md5() (FIPS mode, PLAN 2.2): the same
# md5 the server would compute, over the same normalised bytes.
md-5 = "0.11.0"
# Streams rows for app-side hashing so a huge table never sits in memory.
futures-util = "0.3.32"
flate2 = "1.1.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
# Local clock for the run window (T068): the OS time zone, nothing bundled.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }

[dev-dependencies]
proptest = "1.12.0"
# Generates throwaway X.509 certificates at test time so no private key is ever
# committed to the repo (gitleaks and GitHub secret scanning must stay clean).
rcgen = "0.14.10"
