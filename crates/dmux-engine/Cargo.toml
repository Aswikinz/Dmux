[package]
name = "dmux-engine"
description = "Dmux comparison engine, shared by the desktop app and the CLI (Phase 0 skeleton)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = "0.7.18"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
proptest = "1.12.0"
