[package]
name = "dmux-hooks"
description = "Dmux Python hooks: run untrusted post-run scripts that return extra findings (PLAN 4.9)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
hex = "0.4.3"
thiserror = "2.0.21"
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
serde_json = "1.0.154"
