# TLS-only mock: TCP connections require SSL (hostssl). The unix-socket line
# keeps the postgres image's init scripts working (they connect locally during
# first start). Passwords are scram-sha-256, set by POSTGRES_PASSWORD.
# The host's 127.0.0.1:5439 forward arrives from the podman bridge address, so
# the `all` hostssl line is the one that matches; 127.0.0.1/::1 are kept for
# completeness.
local   all             all                                     trust
hostssl all             all             127.0.0.1/32            scram-sha-256
hostssl all             all             ::1/128                 scram-sha-256
hostssl all             all             all                     scram-sha-256
